  build-all-platforms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: 'true'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build All-in-One Jar with Gradle
        run: ./gradlew :pl-minecraft:shadowJar -PallLibrary

      - name: Upload All-in-One Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeerLink-all-platforms
          path: pl-minecraft/build/libs/*.jar
          if-no-files-found: error