name: Build PeerLink Mod

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x86_64
#          - linux-aarch32
          - linux-aarch64
          - windows-x86_64
#          - windows-aarch64
          - macos-x86_64
          - macos-aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (${{ matrix.platform }})
        run: ./gradlew build -PtargetPlatform=${{ matrix.platform }}

      - name: Upload Platform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeerLink-${{ matrix.platform }}
          path: pl-minecraft/build/libs/*-all.jar
          if-no-files-found: error